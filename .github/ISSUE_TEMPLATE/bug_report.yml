name: Bug report
description: Something is broken — a redirect, an API response, a deploy step
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report. Please redact API keys and any private URLs
        before submitting.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect instead?
      placeholder: |
        POST /api/links with a custom slug returned 409 for a slug that did not exist.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, curl invocations, or a failing test name.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `git rev-parse --short HEAD`, or the image tag.
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Local (cargo run / make dev)
        - Docker Compose
        - systemd
        - Other / unsure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output around the failure. Redact keys.
      render: shell
    validations:
      required: false
