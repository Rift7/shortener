[package]
name = "shortener"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A small, self-hostable URL shortener with an agent-friendly API"
authors = ["Joshua Hedge <joshua@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Rift7/shortener"
homepage = "https://github.com/Rift7/shortener"
keywords = ["url-shortener", "shortener", "axum", "sqlite", "agents"]
categories = ["web-programming::http-server", "database"]
exclude = [".github/", "deploy/", "plugin/"]

[lib]
name = "shortener"
path = "src/lib.rs"

[[bin]]
name = "shortener"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
rand = "0.9"
url = "2"
subtle = "2"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
