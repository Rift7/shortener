version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      patch-and-minor:
        update-types: ["minor", "patch"]
    # Major bumps need code changes and a manual review; not on the bot's schedule.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # The ref of dtolnay/rust-toolchain IS the toolchain version. Bumping it
      # would silently raise the MSRV this repo promises to support.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(docker)"
